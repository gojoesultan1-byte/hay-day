<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hay Day Market</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--primary:#69b342;
--primary-dark:#3e7c2c;
--bg:#f2f7ed;
--card:#fff;
--text:#1c251b;
--muted:#737c70;
--danger:#d84c4c;
--warning:#e3a52d;
--border:#dce6d8;
--shadow:0 10px 35px rgba(0,0,0,.09);
--radius:18px
}
body{
font-family:Tahoma,Arial,sans-serif;
background:var(--bg);
color:var(--text);
min-height:100vh;
transition:.2s
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
img{max-width:100%}
button,input,textarea,select{outline:none}
button:active{transform:scale(.98)}
.header{
position:sticky;
top:0;
z-index:1000;
background:#fff;
box-shadow:0 3px 20px rgba(0,0,0,.12)
}
.header-inner{
max-width:1450px;
margin:auto;
padding:9px 14px;
display:flex;
align-items:center;
gap:10px;
flex-wrap:wrap
}
.logo{
width:57px;
height:57px;
border-radius:15px;
object-fit:cover;
border:2px solid var(--primary);
background:#eee;
flex-shrink:0
}
.brand{
font-size:21px;
font-weight:900;
color:var(--primary-dark);
white-space:nowrap
}
.nav{
display:flex;
gap:7px;
overflow-x:auto;
flex:1;
scrollbar-width:none
}
.nav::-webkit-scrollbar{display:none}
.nav button{
white-space:nowrap;
padding:10px 12px;
border:0;
border-radius:11px;
background:#eef7e9;
color:var(--primary-dark);
font-weight:800
}
.nav button:hover,
.nav button.active{
background:var(--primary);
color:#fff
}
.container{
max-width:1450px;
margin:auto;
padding:20px 14px
}
.hero{
border-radius:28px;
padding:55px 20px;
text-align:center;
background:linear-gradient(135deg,#70bd48,#e9f8d9);
box-shadow:var(--shadow)
}
.hero h1{
font-size:clamp(30px,6vw,60px);
margin-bottom:13px;
font-weight:1000
}
.hero p{
font-size:18px;
line-height:1.9;
max-width:850px;
margin:auto
}
.section{
margin-top:24px
}
.section-head{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-bottom:14px
}
.section-head h2{font-size:25px}
.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:17px
}
.card,
.panel,
.stat{
background:var(--card);
border-radius:var(--radius);
box-shadow:var(--shadow);
padding:15px
}
.card{
overflow:hidden;
transition:.2s
}
.card:hover{transform:translateY(-3px)}
.cover{
width:100%;
height:220px;
object-fit:cover;
border-radius:14px;
background:#e7eee4;
display:block
}
.card h3{
font-size:20px;
margin:11px 0 7px
}
.description{
color:var(--muted);
line-height:1.8;
white-space:pre-wrap;
word-break:break-word
}
.price{
font-size:23px;
font-weight:900;
color:var(--primary-dark);
margin-top:9px
}
.meta{
font-size:14px;
color:var(--muted);
margin-top:6px
}
.badge{
display:inline-block;
padding:5px 9px;
border-radius:30px;
background:#eef7e9;
color:var(--primary-dark);
font-size:12px;
font-weight:900
}
.row{
display:flex;
gap:8px;
flex-wrap:wrap
}
.between{
justify-content:space-between;
align-items:center
}
.btn{
border:0;
padding:10px 14px;
border-radius:11px;
font-weight:800;
transition:.15s
}
.primary{background:var(--primary);color:#fff}
.secondary{background:#eef7e9;color:var(--primary-dark)}
.danger{background:var(--danger);color:#fff}
.warning{background:var(--warning);color:#fff}
.dark{background:#242b23;color:#fff}
.field{margin-bottom:14px}
.field label{
display:block;
font-weight:800;
margin-bottom:6px
}
.field input,
.field textarea,
.field select{
width:100%;
padding:12px;
border:1px solid var(--border);
border-radius:11px;
background:#fff;
color:#222
}
.field textarea{
min-height:115px;
resize:vertical
}
.field input[type="color"]{
padding:4px;
height:45px
}
.field input:focus,
.field textarea:focus,
.field select:focus{
border-color:var(--primary);
box-shadow:0 0 0 3px rgba(105,179,66,.15)
}
.two{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}
.three{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px
}
.four{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px
}
.search{
width:100%;
padding:14px;
border:1px solid var(--border);
border-radius:13px;
background:#fff
}
.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
margin-bottom:18px
}
.stat span{
display:block;
font-size:14px;
color:var(--muted)
}
.stat strong{
display:block;
font-size:29px;
color:var(--primary-dark);
margin-top:6px
}
.empty{
background:#fff;
padding:38px 20px;
border-radius:18px;
box-shadow:var(--shadow);
text-align:center;
color:var(--muted)
}
.notice{
background:#eef7e9;
color:#315c2b;
border-radius:12px;
padding:13px;
line-height:1.8;
margin:10px 0
}
.error{
background:#fff0ef;
color:#a52c29;
border-radius:12px;
padding:12px;
margin:10px 0
}
.picker{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(105px,1fr));
gap:8px
}
.slot{
height:105px;
border:2px dashed #94bd83;
border-radius:13px;
background:#f8fbf6;
display:flex;
align-items:center;
justify-content:center;
position:relative;
overflow:hidden;
color:var(--primary);
font-size:40px;
font-weight:900
}
.slot img{
width:100%;
height:100%;
object-fit:cover
}
.remove-img{
position:absolute;
top:4px;
left:4px;
width:28px;
height:28px;
border:0;
border-radius:50%;
background:var(--danger);
color:#fff;
font-weight:900
}
.gallery{
display:flex;
gap:7px;
overflow:auto;
margin-top:9px
}
.gallery img{
width:65px;
height:65px;
object-fit:cover;
border-radius:9px;
flex-shrink:0;
cursor:pointer
}
.modal{
display:none;
position:fixed;
inset:0;
z-index:5000;
background:rgba(0,0,0,.73);
align-items:center;
justify-content:center;
padding:15px
}
.modal.open{display:flex}
.modal-box{
width:min(780px,100%);
max-height:94vh;
overflow:auto;
background:#fff;
border-radius:22px;
padding:23px;
position:relative
}
.close{
position:absolute;
left:10px;
top:10px;
width:37px;
height:37px;
border:0;
border-radius:50%;
background:#eee;
font-size:24px
}
.request{
border:1px solid var(--border);
border-radius:16px;
padding:15px;
margin-bottom:12px
}
.request-images{
display:flex;
gap:8px;
overflow:auto;
margin-top:10px
}
.request-images img{
width:85px;
height:85px;
object-fit:cover;
border-radius:10px;
flex-shrink:0
}
.table-wrap{overflow:auto}
table{
width:100%;
border-collapse:collapse;
min-width:680px
}
th,td{
padding:10px;
border-bottom:1px solid var(--border);
text-align:right
}
th{background:#f0f7ec;color:var(--primary-dark)}
.footer{
margin-top:40px;
padding:30px 15px;
text-align:center;
background:#20261f;
color:#fff
}
.toast{
position:fixed;
bottom:20px;
right:20px;
z-index:9000;
background:#20261f;
color:#fff;
padding:14px 18px;
border-radius:12px;
box-shadow:var(--shadow);
display:none
}
.toast.show{display:block}
.small{font-size:13px}
.center{text-align:center}
.hidden{display:none!important}
.divider{
height:1px;
background:var(--border);
margin:18px 0
}
@media(max-width:950px){
.stats{grid-template-columns:1fr 1fr}
.four{grid-template-columns:1fr 1fr}
.three{grid-template-columns:1fr 1fr}
}
@media(max-width:650px){
.header-inner{padding:7px 9px}
.logo{width:48px;height:48px}
.brand{font-size:18px}
.nav{flex-basis:100%;order:3}
.two,.three,.four{grid-template-columns:1fr}
.hero{padding:40px 15px}
.hero p{font-size:16px}
.container{padding:16px 9px}
.stats{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>

<header class="header">
<div class="header-inner">
<img id="siteLogo" class="logo" alt="logo">
<div id="siteBrand" class="brand">Hay Day Market</div>
<nav id="nav" class="nav"></nav>
</div>
</header>

<main id="app"></main>

<footer class="footer">
<div id="footerName">Hay Day Market</div>
<div style="margin-top:7px;color:#bcc5b9">
منصة هاي داي للإعلانات والحسابات والمنتجات
</div>
</footer>

<div id="modal" class="modal">
<div class="modal-box">
<button class="close" onclick="closeModal()">×</button>
<div id="modalBody"></div>
</div>
</div>

<div id="toast" class="toast"></div>

<script>
"use strict";

/* =========================================================
   إعدادات المالك
========================================================= */

const OWNER_ID="111111111";
const OWNER_EMAIL="gojoesultan1@gmail.com";
const OWNER_PASSWORD="ahmedgojo123456789";

const DB_KEY="HAYDAY_MARKET_DATABASE";
const SESSION_KEY="HAYDAY_MARKET_SESSION";

/* =========================================================
   قاعدة البيانات الافتراضية
========================================================= */

const DEFAULT_DB={
users:[
{
id:OWNER_ID,
name:"Gojo Esultan",
email:OWNER_EMAIL,
phone:"",
password:OWNER_PASSWORD,
role:"admin",
avatar:"",
createdAt:Date.now()
}
],
posts:[],
requests:[],
notifications:[],
orders:[],
favorites:[],
reports:[],
settings:{
siteName:"Hay Day Market",
heroTitle:"متجر ومنصة هاي داي",
heroText:"حسابات هاي داي ومنشورات ومنتجات في مكان واحد.",
announcement:"مرحبًا بك في منصة هاي داي",
currency:"جنيه",
primary:"#69b342",
background:"#f2f7ed",
backgroundImage:"",
logo:"",
footerText:"منصة هاي داي للإعلانات والحسابات والمنتجات",
maintenance:false
}
};

/* =========================================================
   متغيرات عامة
========================================================= */

let db=loadDatabase();
let session=localStorage.getItem(SESSION_KEY)||"";
let uploadImages=[];
let editImages=[];
let currentCategory="all";

/* =========================================================
   قاعدة البيانات
========================================================= */

function loadDatabase(){
try{
const saved=localStorage.getItem(DB_KEY);
if(saved){
const parsed=JSON.parse(saved);
return mergeDatabase(parsed);
}
}catch(error){
console.warn(error);
}
return structuredClone(DEFAULT_DB);
}

function mergeDatabase(data){
const base=structuredClone(DEFAULT_DB);
if(!data||typeof data!=="object")return base;
for(const key of Object.keys(base)){
if(data[key]!==undefined)base[key]=data[key];
}
if(!Array.isArray(base.users))base.users=[];
if(!Array.isArray(base.posts))base.posts=[];
if(!Array.isArray(base.requests))base.requests=[];
if(!Array.isArray(base.notifications))base.notifications=[];
if(!Array.isArray(base.orders))base.orders=[];
if(!Array.isArray(base.favorites))base.favorites=[];
if(!Array.isArray(base.reports))base.reports=[];
if(!base.settings)base.settings=structuredClone(DEFAULT_DB.settings);
return base;
}

function saveDatabase(){
localStorage.setItem(DB_KEY,JSON.stringify(db));
}

/* =========================================================
   مساعدات
========================================================= */

function uid(){
return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,11);
}

function esc(value){
return String(value??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

function money(value){
return Number(value||0).toLocaleString("ar-EG");
}

function getUser(){
return db.users.find(u=>u.id===session)||null;
}

function isAdmin(){
const user=getUser();
return !!(
user &&
user.id===OWNER_ID &&
user.email===OWNER_EMAIL &&
user.password===OWNER_PASSWORD &&
user.role==="admin"
);
}

function setSession(id){
session=id||"";
if(session)localStorage.setItem(SESSION_KEY,session);
else localStorage.removeItem(SESSION_KEY);
}

function toast(message){
const el=document.getElementById("toast");
el.textContent=message;
el.classList.add("show");
clearTimeout(window.toastTimer);
window.toastTimer=setTimeout(()=>el.classList.remove("show"),2800);
}

function openModal(html){
document.getElementById("modalBody").innerHTML=html;
document.getElementById("modal").classList.add("open");
}

function closeModal(){
document.getElementById("modal").classList.remove("open");
}

function defaultLogo(){
return "data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">
<rect width="300" height="300" rx="70" fill="#69b342"/>
<circle cx="150" cy="135" r="75" fill="#fff"/>
<text x="150" y="154" text-anchor="middle" font-family="Arial" font-weight="900" font-size="58" fill="#3e7c2c">HD</text>
<text x="150" y="245" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="28" fill="#fff">MARKET</text>
</svg>`);
}

/* =========================================================
   الإعدادات
========================================================= */

function applySettings(){
const s=db.settings;
document.title=s.siteName||"Hay Day Market";

document.getElementById("siteBrand").textContent=s.siteName||"Hay Day Market";
document.getElementById("footerName").textContent=s.footerText||s.siteName||"Hay Day Market";

document.getElementById("siteLogo").src=s.logo||defaultLogo();

document.documentElement.style.setProperty(
"--primary",
s.primary||"#69b342"
);

document.body.style.backgroundColor=s.background||"#f2f7ed";

if(s.backgroundImage){
document.body.style.backgroundImage=`url("${s.backgroundImage}")`;
document.body.style.backgroundSize="cover";
document.body.style.backgroundAttachment="fixed";
}else{
document.body.style.backgroundImage="none";
}

renderNav();
}

function renderNav(){
let html=`
<button onclick="showHome()">الرئيسية</button>
<button onclick="showCategory('accounts')">حسابات هاي داي</button>
<button onclick="showCategory('posts')">منشورات هاي داي</button>
<button onclick="showCategory('products')">منتجات هاي داي</button>
<button onclick="openRequestForm()">➕ إضافة إعلان</button>
`;

const user=getUser();

if(user){
html+=`
<button onclick="showMyArea()">👤 حسابي</button>
<button onclick="showMyRequests()">📨 طلباتي</button>
<button onclick="showNotifications()">🔔 الإشعارات</button>
`;
}else{
html+=`<button onclick="openLogin()">👤 تسجيل الدخول</button>`;
}

if(isAdmin()){
html+=`<button onclick="showAdmin()">⚙️ لوحة الأدمن</button>`;
}

document.getElementById("nav").innerHTML=html;
}

/* =========================================================
   الرئيسية
========================================================= */

function showHome(){
currentCategory="all";

const posts=[...db.posts].sort((a,b)=>Number(b.createdAt)-Number(a.createdAt));

document.getElementById("app").innerHTML=`
<div class="container">

<div class="hero">
<div class="badge">${esc(db.settings.announcement||"مرحبًا بك")}</div>
<h1>${esc(db.settings.heroTitle)}</h1>
<p>${esc(db.settings.heroText)}</p>

<div class="row" style="justify-content:center;margin-top:20px">
<button class="btn primary" onclick="showCategory('accounts')">حسابات هاي داي</button>
<button class="btn secondary" onclick="showCategory('posts')">منشورات هاي داي</button>
<button class="btn secondary" onclick="showCategory('products')">منتجات هاي داي</button>
<button class="btn dark" onclick="openRequestForm()">إضافة إعلان</button>
</div>
</div>

<div class="section">
<div class="section-head">
<h2>🔥 أحدث الإعلانات</h2>
<span class="badge">${posts.length} إعلان</span>
</div>

<input id="homeSearch" class="search"
placeholder="🔎 ابحث في الإعلانات..."
oninput="filterCards('homeSearch','homeGrid')">

<div id="homeGrid" class="grid" style="margin-top:15px">
${posts.length?posts.map(postCard).join(""):emptyBox("لا توجد إعلانات منشورة حاليًا")}
</div>
</div>

<div class="section">
<div class="grid">
${infoCard("👥","حسابات هاي داي","تصفح الحسابات المعروضة للبيع.")}
${infoCard("📢","منشورات هاي داي","إعلانات ومحتوى مجتمع اللعبة.")}
${infoCard("📦","منتجات هاي داي","منتجات وعروض مختلفة.")}
${infoCard("🛡️","مراجعة الإدارة","الطلبات تمر على المالك قبل النشر.")}
</div>
</div>

</div>
`;

window.scrollTo(0,0);
}

function infoCard(icon,title,text){
return`
<div class="card center">
<div style="font-size:42px">${icon}</div>
<h3>${esc(title)}</h3>
<p class="description">${esc(text)}</p>
</div>`;
}

function emptyBox(text){
return`<div class="empty">${esc(text)}</div>`;
}

/* =========================================================
   التصنيفات
========================================================= */

function showCategory(category){
currentCategory=category;

const posts=db.posts
.filter(p=>category==="all"||p.category===category)
.sort((a,b)=>Number(b.createdAt)-Number(a.createdAt));

document.getElementById("app").innerHTML=`
<div class="container">

<div class="section-head">
<h2>${categoryName(category)}</h2>
<button class="btn primary" onclick="openRequestForm()">➕ إضافة إعلان</button>
</div>

<input id="categorySearch" class="search"
placeholder="🔎 ابحث داخل هذا القسم..."
oninput="filterCards('categorySearch','categoryGrid')">

<div id="categoryGrid" class="grid" style="margin-top:15px">
${posts.length?posts.map(postCard).join(""):emptyBox("لا توجد إعلانات في هذا القسم")}
</div>

</div>
`;
}

function categoryName(category){
if(category==="accounts")return"حسابات هاي داي";
if(category==="products")return"منتجات هاي داي";
if(category==="posts")return"منشورات هاي داي";
return"كل الإعلانات";
}

function filterCards(inputId,gridId){
const input=document.getElementById(inputId);
const grid=document.getElementById(gridId);
if(!input||!grid)return;
const q=input.value.trim().toLowerCase();
grid.querySelectorAll(".card").forEach(card=>{
card.style.display=!q||card.innerText.toLowerCase().includes(q)?"":"none";
});
}

/* =========================================================
   كارت المنشور
========================================================= */

function postCard(post){
const image=post.images?.[0]||"";
const fav=isFavorite(post.id);

return`
<article class="card">

${image?
`<img class="cover" src="${image}" alt="" onclick="viewPost('${post.id}')">`
:
`<div class="cover" style="display:flex;align-items:center;justify-content:center;font-size:55px">📦</div>`
}

<div style="margin-top:11px">
<span class="badge">${categoryName(post.category)}</span>

<h3>${esc(post.title)}</h3>

<div class="description">${esc(post.description)}</div>

<div class="price">${money(post.price)} ${esc(db.settings.currency)}</div>

<div class="meta">📦 المتوفر: ${money(post.quantity)}</div>
<div class="meta">👁️ المشاهدات: ${money(post.views)}</div>

<div class="row" style="margin-top:11px">
<button class="btn secondary" onclick="likePost('${post.id}')">❤️ ${money(post.likes)}</button>
<button class="btn secondary" onclick="dislikePost('${post.id}')">👎 ${money(post.dislikes)}</button>
<button class="btn ${fav?"gold":"secondary"}" onclick="toggleFavorite('${post.id}')">
${fav?"★":"☆"} مفضلة
</button>
<button class="btn secondary" onclick="viewPost('${post.id}')">عرض</button>
</div>

${post.images?.length>1?`
<div class="gallery">
${post.images.map((x,i)=>`
<img src="${x}" onclick="viewImage('${post.id}',${i})">
`).join("")}
</div>`:""}

</div>
</article>
`;
}

/* =========================================================
   المنشور
========================================================= */

function viewPost(postId){
const post=db.posts.find(p=>p.id===postId);
if(!post)return;

post.views=Number(post.views||0)+1;
saveDatabase();

openModal(`
<h2>${esc(post.title)}</h2>

<div style="margin-top:10px">
<span class="badge">${categoryName(post.category)}</span>
</div>

${post.images?.length?`
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:15px">
${post.images.map((x,i)=>`
<img src="${x}" style="width:100%;height:155px;object-fit:cover;border-radius:12px;cursor:pointer" onclick="viewImage('${post.id}',${i})">
`).join("")}
</div>`:""}

<div class="notice">
💰 السعر: <strong>${money(post.price)} ${esc(db.settings.currency)}</strong><br>
📦 الكمية: <strong>${money(post.quantity)}</strong><br>
👁️ المشاهدات: <strong>${money(post.views)}</strong><br>
❤️ الإعجابات: <strong>${money(post.likes)}</strong>
</div>

function likePost(id){
const post=db.posts.find(p=>p.id===id);
if(!post)return;
post.likes=Math.max(0,Number(post.likes||0)+1);
saveDatabase();
toast("تم تسجيل الإعجاب ❤️");
if(currentCategory==="all")showHome();
else showCategory(currentCategory);
}

function dislikePost(id){
const post=db.posts.find(p=>p.id===id);
if(!post)return;
post.dislikes=Math.max(0,Number(post.dislikes||0)+1);
saveDatabase();
toast("تم تسجيل التقييم");
if(currentCategory==="all")showHome();
else showCategory(currentCategory);
}

function isFavorite(postId){
const user=getUser();
if(!user)return false;
return db.favorites.some(f=>f.userId===user.id&&f.postId===postId);
}

function toggleFavorite(postId){
const user=getUser();
if(!user){
openLogin();
return;
}

const index=db.favorites.findIndex(
f=>f.userId===user.id&&f.postId===postId
);

if(index>=0){
db.favorites.splice(index,1);
toast("تمت الإزالة من المفضلة");
}else{
db.favorites.push({id:uid(),userId:user.id,postId});
toast("تمت الإضافة للمفضلة ⭐");
}

saveDatabase();
if(currentCategory==="all")showHome();
else showCategory(currentCategory);
}

</div>

يمكنك اختيار أكثر من صورة من الهاتف.
</div>

<button class="btn primary" onclick="submitRequest()">📨 إرسال الطلب للمالك</button>
`);
renderPicker("request");
}

function readImages(event,type){
const files=[...event.target.files||[]];

files.forEach(file=>{
if(!file.type.startsWith("image/"))return;

const reader=new FileReader();

reader.onload=e=>{
if(type==="request")uploadImages.push(e.target.result);
if(type==="edit")editImages.push(e.target.result);
renderPicker(type);
};

reader.readAsDataURL(file);
});

event.target.value="";
}

function renderPicker(type){
const element=document.getElementById(
type==="request"?"requestPicker":"editPicker"
);
if(!element)return;

const arr=type==="request"?uploadImages:editImages;

element.innerHTML=
arr.map((image,index)=>`
<div class="slot">
<img src="${image}">
<button class="remove-img" onclick="removeTempImage('${type}',${index})">×</button>
</div>
`).join("")+
`
<div class="slot" onclick="
document.getElementById('${type==="request"?"requestFiles":"editFiles"}').click()
">+</div>
`;
}

function removeTempImage(type,index){
if(type==="request")uploadImages.splice(index,1);
else editImages.splice(index,1);
renderPicker(type);
}

function approveRequest(id){
if(!isAdmin())return;

const request=db.requests.find(r=>r.id===id);
if(!request)return;

db.posts.unshift({
id:uid(),
title:request.title,
category:request.category,
price:request.price,
quantity:request.quantity,
description:request.description,
images:[...(request.images||[])],
likes:0,
dislikes:0,
views:0,
ownerId:OWNER_ID,
customerOwnerId:request.userId,
createdAt:Date.now(),
updatedAt:Date.now()
});

request.status="approved";
request.approvedAt=Date.now();

db.notifications.unshift({
id:uid(),
userId:request.userId,
type:"approved",
title:"✅ تمت الموافقة على إعلانك",
message:"تمت الموافقة على طلب إعلانك ونشره على الموقع.",
read:false,
createdAt:Date.now()
});

saveDatabase();
toast("تمت الموافقة والنشر");
showAdmin();
}

function rejectRequest(id){
if(!isAdmin())return;

const request=db.requests.find(r=>r.id===id);
if(!request)return;

request.status="rejected";
request.rejectedAt=Date.now();

db.notifications.unshift({
id:uid(),
userId:request.userId,
type:"rejected",
title:"❌ تم رفض إعلانك",
message:"تم رفض طلب الإعلان من الإدارة.",
read:false,
createdAt:Date.now()
});

saveDatabase();

showAdmin();

function changeStat(postId,key,amount){
if(!isAdmin())return;

const post=db.posts.find(p=>p.id===postId);
if(!post)return;

post[key]=Math.max(0,Number(post[key]||0)+amount);
saveDatabase();
showAdmin();
}

function editPost(postId){
if(!isAdmin())return;

const post=db.posts.find(p=>p.id===postId);
if(!post)return;

editImages=[...(post.images||[])];

openModal(`
<h2>✏️ تعديل الإعلان</h2>

<div class="field">
<label>اسم الإعلان</label>
<input id="editTitle" value="${esc(post.title)}">

<option value="accounts" ${post.category==="accounts"?"selected":""}>حسابات هاي داي</option>
<option value="posts" ${post.category==="posts"?"selected":""}>منشورات هاي داي</option>
<option value="products" ${post.category==="products"?"selected":""}>منتجات هاي داي</option>
</select>
</div>

<div class="two">
<div class="field">
<label>السعر</label>
<input id="editPrice" type="number" value="${Number(post.price||0)}">
</div>

<div class="field">
<label>الكمية</label>
<input id="editQuantity" type="number" value="${Number(post.quantity||0)}">
</div>
</div>

<textarea id="editDescription">${esc(post.description)}</textarea>
</div>

<div class="field">
<label>الصور الحالية والجديدة</label>
<div id="editPicker" class="picker"></div>
<input id="editFiles" type="file" accept="image/*" multiple hidden onchange="readImages(event,'edit')">
</div>

<button class="btn primary" onclick="saveEditedPost('${post.id}')">💾 حفظ التعديلات</button>
`);
renderPicker("edit");
}

function saveEditedPost(postId){
if(!isAdmin())return;

const post=db.posts.find(p=>p.id===postId);
if(!post)return;

post.title=document.getElementById("editTitle").value.trim();
post.category=document.getElementById("editCategory").value;
post.price=Number(document.getElementById("editPrice").value||0);
post.quantity=Number(document.getElementById("editQuantity").value||0);
post.description=document.getElementById("editDescription").value.trim();
post.images=[...editImages];
post.updatedAt=Date.now();

saveDatabase();
closeModal();
toast("تم حفظ التعديلات");
showAdmin();
}

function deletePost(postId){
if(!isAdmin())return;

if(!confirm("هل تريد حذف المنشور نهائيًا؟"))return;

db.posts=db.posts.filter(p=>p.id!==postId);
db.favorites=db.favorites.filter(f=>f.postId!==postId);

saveDatabase();
toast("تم حذف المنشور");
showAdmin();
}

${
reports.length?
reports.map(r=>{

return`
<div class="request">

${esc(post?.title||"منشور محذوف")}
</h3>

</p>

</div>

</div>
`;
}).join("")
:
emptyBox("لا توجد بلاغات.")
}

function resolveReport(id){
const r=db.reports.find(x=>x.id===id);
if(!r)return;
r.status="resolved";
saveDatabase();
showAdmin();
}

function deletePostFromReport(reportId,postId){
if(!confirm("حذف المنشور؟"))return;
db.posts=db.posts.filter(p=>p.id!==postId);
const report=db.reports.find(r=>r.id===reportId);
if(report)report.status="resolved";
saveDatabase();
showAdmin();
}

function saveSettings(){
if(!isAdmin())return;

db.settings.siteName=document.getElementById("setName").value.trim()||"Hay Day Market";
db.settings.heroTitle=document.getElementById("setHeroTitle").value.trim();
db.settings.heroText=document.getElementById("setHeroText").value.trim();
db.settings.announcement=document.getElementById("setAnnouncement").value.trim();
db.settings.footerText=document.getElementById("setFooter").value.trim();
db.settings.background=document.getElementById("setBg").value;
db.settings.primary=document.getElementById("setPrimary").value;
db.settings.currency=document.getElementById("setCurrency").value.trim()||"جنيه";

saveDatabase();
applySettings();
toast("تم حفظ إعدادات الموقع");
showAdmin();
}

function saveSettingImage(event,type){
if(!isAdmin())return;

const file=event.target.files?.[0];
if(!file)return;

if(!file.type.startsWith("image/")){
alert("اختر صورة فقط.");
return;
}

const reader=new FileReader();

reader.onload=e=>{
db.settings[type]=e.target.result;
saveDatabase();
applySettings();
showAdmin();
toast("تم تحديث الصورة");
};

reader.readAsDataURL(file);
}

function clearLogo(){
if(!isAdmin())return;
db.settings.logo="";
saveDatabase();
applySettings();
showAdmin();
}

function clearBackground(){
if(!isAdmin())return;
db.settings.backgroundImage="";
saveDatabase();
applySettings();
showAdmin();
}

/* =========================================================
   تصدير البيانات
========================================================= */

function exportData(){
if(!isAdmin())return;

const data=JSON.stringify(db,null,2);
const blob=new Blob([data],{type:"application/json"});
const url=URL.createObjectURL(blob);

const a=document.createElement("a");
a.href=url;
a.download="hay-day-market-backup.json";
a.click();

URL.revokeObjectURL(url);
toast("تم تجهيز النسخة الاحتياطية");
}

function importDataPrompt(){
if(!isAdmin())return;

const input=document.createElement("input");
input.type="file";
input.accept=".json,application/json";

input.onchange=()=>{
const file=input.files?.[0];
if(!file)return;

const reader=new FileReader();

reader.onload=e=>{
try{
const imported=JSON.parse(e.target.result);
db=mergeDatabase(imported);
saveDatabase();
applySettings();
showAdmin();
toast("تم استيراد البيانات");
}catch(error){
alert("ملف غير صالح.");
}
};

reader.readAsText(file);
};

input.click();
}

function searchEverything(q){
const query=String(q||"").toLowerCase();
return db.posts.filter(p=>
[p.title,p.description,categoryName(p.category)]
.join(" ")
.toLowerCase()
.includes(query)
);
}

function getPostCount(category){
return db.posts.filter(p=>p.category===category).length;
}

function totalViews(){
return db.posts.reduce((sum,p)=>sum+Number(p.views||0),0);
}

function totalLikes(){
return db.posts.reduce((sum,p)=>sum+Number(p.likes||0),0);
}

function totalDislikes(){
return db.posts.reduce((sum,p)=>sum+Number(p.dislikes||0),0);
}

function totalRequests(){
return db.requests.length;
}

function pendingRequests(){
return db.requests.filter(r=>r.status==="pending").length;
}

function totalUsers(){
return db.users.length;
}

if(!owner){
db.users.unshift({
id:OWNER_ID,
name:"Gojo Esultan",
email:OWNER_EMAIL,
phone:"",
password:OWNER_PASSWORD,
role:"admin",
avatar:"",
createdAt:Date.now()
});
}else{
owner.email=OWNER_EMAIL;
owner.password=OWNER_PASSWORD;
owner.role="admin";
}

saveDatabase();
}

function validateSession(){
const user=getUser();

if(session&&!user){
setSession("");
}

if(user&&user.id===OWNER_ID){
if(
user.email!==OWNER_EMAIL||
user.password!==OWNER_PASSWORD||
user.role!=="admin"
){
user.email=OWNER_EMAIL;
user.password=OWNER_PASSWORD;
user.role="admin";
saveDatabase();
}
}
}
