<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hay Day Store</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

:root{
--green:#65b33f;
--dark-green:#39752b;
--light-green:#edf7e8;
--white:#ffffff;
--text:#202820;
--muted:#737b72;
--danger:#d9534f;
--warning:#e5a832;
--shadow:0 8px 30px rgba(0,0,0,.09);
--radius:18px;
}

html{
scroll-behavior:smooth;
}

body{
font-family:Arial,Tahoma,sans-serif;
background:#f3f7ef;
color:var(--text);
min-height:100vh;
transition:.25s;
}

button,
input,
textarea,
select{
font:inherit;
}

button{
cursor:pointer;
}

img{
max-width:100%;
}

.header{
position:sticky;
top:0;
z-index:1000;
background:#fff;
box-shadow:0 3px 20px rgba(0,0,0,.12);
}

.header-inner{
width:min(1350px,100%);
margin:auto;
padding:10px 15px;
display:flex;
align-items:center;
gap:12px;
flex-wrap:wrap;
}

.logo{
width:58px;
height:58px;
border-radius:50%;
object-fit:cover;
background:#fff;
border:3px solid var(--green);
flex-shrink:0;
}

.site-name{
font-size:23px;
font-weight:900;
color:var(--dark-green);
white-space:nowrap;
}

.nav{
display:flex;
align-items:center;
gap:7px;
overflow-x:auto;
flex:1;
padding:3px;
scrollbar-width:none;
}

.nav::-webkit-scrollbar{
display:none;
}

.nav button{
border:0;
padding:10px 13px;
border-radius:11px;
background:var(--light-green);
color:var(--dark-green);
font-weight:800;
white-space:nowrap;
transition:.2s;
}

.nav button:hover{
background:var(--green);
color:#fff;
transform:translateY(-1px);
}

.container{
width:min(1350px,100%);
margin:auto;
padding:22px 15px;
}

.hero{
min-height:330px;
padding:50px 20px;
border-radius:28px;
background:linear-gradient(135deg,#79ca4c,#e3f7cc);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
box-shadow:var(--shadow);
}

.hero h1{
font-size:clamp(32px,7vw,58px);
font-weight:1000;
margin-bottom:14px;
}

.hero p{
font-size:19px;
max-width:750px;
line-height:1.8;
}

.section-head{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
margin:25px 0 15px;
}

.section-head h2{
font-size:25px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:18px;
}

.card{
background:#fff;
border-radius:var(--radius);
padding:15px;
box-shadow:var(--shadow);
overflow:hidden;
transition:.2s;
}

.card:hover{
transform:translateY(-3px);
}

.card-image{
width:100%;
height:220px;
object-fit:cover;
border-radius:14px;
background:#e8eee5;
display:block;
}

.card h3{
font-size:20px;
margin:12px 0 8px;
}

.description{
color:var(--muted);
line-height:1.8;
min-height:52px;
white-space:pre-wrap;
word-break:break-word;
}

.price{
font-size:23px;
font-weight:900;
color:var(--dark-green);
margin-top:10px;
}

.meta{
font-size:14px;
color:var(--muted);
margin-top:7px;
}

.actions{
display:flex;
flex-wrap:wrap;
gap:7px;
margin-top:12px;
}

.btn{
border:0;
padding:10px 14px;
border-radius:11px;
font-weight:800;
transition:.2s;
}

.btn:hover{
transform:translateY(-1px);
}

.primary{
background:var(--green);
color:#fff;
}

.secondary{
background:var(--light-green);
color:var(--dark-green);
}

.danger{
background:var(--danger);
color:#fff;
}

.warning{
background:var(--warning);
color:#fff;
}

.panel{
background:#fff;
border-radius:20px;
padding:20px;
box-shadow:var(--shadow);
margin-bottom:18px;
}

.field{
margin-bottom:14px;
}

.field label{
display:block;
font-weight:800;
margin-bottom:7px;
}

.field input,
.field textarea,
.field select{
width:100%;
padding:12px;
border:1px solid #d5ddd0;
border-radius:11px;
outline:none;
background:#fff;
color:#222;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
border-color:var(--green);
box-shadow:0 0 0 3px rgba(101,179,63,.12);
}

.field textarea{
min-height:120px;
resize:vertical;
}

.two{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.three{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
}

.image-picker{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(105px,1fr));
gap:9px;
}

.image-slot{
height:105px;
border:2px dashed #91bd80;
border-radius:13px;
display:flex;
align-items:center;
justify-content:center;
position:relative;
overflow:hidden;
background:#f8fbf6;
color:var(--green);
font-size:38px;
font-weight:900;
}

.image-slot.add{
cursor:pointer;
}

.image-slot img{
width:100%;
height:100%;
object-fit:cover;
}

.remove-image{
position:absolute;
top:5px;
left:5px;
width:28px;
height:28px;
border:0;
border-radius:50%;
background:var(--danger);
color:#fff;
font-size:18px;
font-weight:900;
z-index:2;
}

.modal{
display:none;
position:fixed;
inset:0;
z-index:5000;
background:rgba(0,0,0,.72);
align-items:center;
justify-content:center;
padding:15px;
}

.modal.active{
display:flex;
}

.modal-box{
position:relative;
width:min(700px,100%);
max-height:93vh;
overflow:auto;
background:#fff;
border-radius:22px;
padding:23px;
}

.close{
position:absolute;
left:10px;
top:10px;
width:36px;
height:36px;
border:0;
border-radius:50%;
background:#eee;
font-size:23px;
}

.notice{
padding:14px;
border-radius:12px;
background:#eef7e9;
color:#315d29;
line-height:1.8;
margin:12px 0;
}

.error{
padding:12px;
border-radius:12px;
background:#fff0ef;
color:#9e2926;
margin:10px 0;
}

.badge{
display:inline-block;
padding:5px 9px;
border-radius:30px;
background:var(--light-green);
color:var(--dark-green);
font-size:12px;
font-weight:900;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
margin-bottom:18px;
}

.stat{
background:#fff;
border-radius:18px;
padding:18px;
box-shadow:var(--shadow);
}

.stat span{
color:var(--muted);
font-size:14px;
}

.stat strong{
display:block;
font-size:29px;
margin-top:7px;
color:var(--dark-green);
}

.request{
border:1px solid #e0e7dc;
border-radius:16px;
padding:15px;
margin-bottom:12px;
background:#fff;
}

.request-images{
display:flex;
gap:8px;
overflow-x:auto;
margin-top:10px;
padding-bottom:4px;
}

.request-images img{
width:85px;
height:85px;
border-radius:10px;
object-fit:cover;
flex-shrink:0;
}

.admin-image-list{
display:flex;
gap:7px;
overflow-x:auto;
margin-top:10px;
}

.admin-image-list img{
width:70px;
height:70px;
object-fit:cover;
border-radius:9px;
}

.empty{
padding:35px 20px;
background:#fff;
border-radius:18px;
text-align:center;
color:#777;
box-shadow:var(--shadow);
}

.search-box{
margin-bottom:18px;
}

.search-box input{
width:100%;
padding:14px;
border-radius:13px;
border:1px solid #d5ddd0;
outline:none;
}

.table-wrap{
width:100%;
overflow:auto;
}

table{
width:100%;
border-collapse:collapse;
min-width:650px;
}

th,
td{
padding:11px;
border-bottom:1px solid #e4e9e1;
text-align:right;
}

th{
background:#f2f7ef;
color:var(--dark-green);
}

.footer{
margin-top:40px;
background:#20261f;
color:#fff;
padding:32px 15px;
text-align:center;
}

.gallery{
display:flex;
gap:7px;
overflow:auto;
margin-top:10px;
padding-bottom:3px;
}

.gallery img{
width:62px;
height:62px;
border-radius:9px;
object-fit:cover;
flex-shrink:0;
cursor:pointer;
}

.separator{
height:1px;
background:#e6ebe3;
margin:18px 0;
}

.text-center{
text-align:center;
}

.mt{
margin-top:15px;
}

.mb{
margin-bottom:15px;
}

.hidden{
display:none!important;
}

@media(max-width:900px){

.stats{
grid-template-columns:1fr 1fr;
}

.three{
grid-template-columns:1fr;
}

}

@media(max-width:650px){

.header-inner{
padding:8px 10px;
}

.logo{
width:50px;
height:50px;
}

.site-name{
font-size:18px;
}

.nav{
order:3;
flex-basis:100%;
width:100%;
}

.two{
grid-template-columns:1fr;
}

.hero{
min-height:250px;
padding:35px 15px;
}

.hero p{
font-size:16px;
}

.container{
padding:17px 10px;
}

.stats{
grid-template-columns:1fr 1fr;
}

.section-head{
align-items:flex-start;
flex-direction:column;
}

}

@media(max-width:400px){

.stats{
grid-template-columns:1fr;
}

}
</style>
</head>

<body>

<header class="header">

<div class="header-inner">

<img
id="siteLogo"
class="logo"
alt="Hay Day Store Logo">

<div
id="siteName"
class="site-name">
Hay Day Store
</div>

<nav
id="navigation"
class="nav">
</nav>

</div>

</header>

<main id="app"></main>

<footer class="footer">

<div id="footerName">
Hay Day Store
</div>

<div style="margin-top:8px;color:#b9c2b6">
منصة إعلانات ومنتجات لعبة هاي داي
</div>

</footer>

<div
id="modal"
class="modal">

<div
class="modal-box">

<button
class="close"
onclick="closeModal()">
×
</button>

<div id="modalContent"></div>

</div>

</div>

<script>
"use strict";

/* ============================================================
   HAY DAY STORE
   نظام متجر وإعلانات محلي
   ============================================================ */


/* ============================================================
   بيانات المالك
   ============================================================ */

const OWNER_ID =
"111111111";

const OWNER_EMAIL =
"gojoesultan1@gmail.com";

const OWNER_PASSWORD =
"111111111";


/* ============================================================
   مفتاح قاعدة البيانات
   ============================================================ */

const DATABASE_KEY =
"HAY_DAY_STORE_DATABASE_V2";


/* ============================================================
   إنشاء قاعدة البيانات
   ============================================================ */

let database =
JSON.parse(
localStorage.getItem(
DATABASE_KEY
) || "null"
);


/* ============================================================
   قاعدة البيانات الافتراضية
   ============================================================ */

if(!database){

database={

users:[

{

id:OWNER_ID,

name:"Gojo Esultan",

email:OWNER_EMAIL,

phone:"",

password:OWNER_PASSWORD,

role:"admin",

createdAt:
new Date().toISOString()

}

],

posts:[],

requests:[],

notifications:[],

settings:{

siteName:
"Hay Day Store",

title:
"مرحبًا بك في Hay Day Store",

subtitle:
"حسابات ومنشورات ومنتجات لعبة هاي داي",

backgroundColor:
"#f3f7ef",

backgroundImage:"",

logo:"",

primaryColor:
"#65b33f"

}

};

saveDatabase();

}


/* ============================================================
   جلسة المستخدم
   ============================================================ */

let loggedUserId =
localStorage.getItem(
"HAY_DAY_SESSION"
) || null;


/* ============================================================
   مصفوفات الصور
   ============================================================ */

let requestImages=[];

let adminImages=[];


/* ============================================================
   حفظ قاعدة البيانات
   ============================================================ */

function saveDatabase(){

localStorage.setItem(
DATABASE_KEY,
JSON.stringify(database)
);

}


/* ============================================================
   حفظ الجلسة
   ============================================================ */

function saveSession(){

if(loggedUserId){

localStorage.setItem(
"HAY_DAY_SESSION",
loggedUserId
);

}else{

localStorage.removeItem(
"HAY_DAY_SESSION"
);

}

}


/* ============================================================
   إنشاء ID
   ============================================================ */

function generateId(){

return (
Date.now().toString(36)+
"-"+
Math.random()
.toString(36)
.substring(2,10)
);

}


/* ============================================================
   حماية HTML
   ============================================================ */

function escapeHTML(value){

return String(
value ?? ""
)

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;")

.replaceAll("'","&#039;");

}


/* ============================================================
   المستخدم الحالي
   ============================================================ */

function getCurrentUser(){

if(!loggedUserId){

return null;

}

return database.users.find(
user =>
user.id === loggedUserId
) || null;

}


/* ============================================================
   التحقق من الأدمن
   ============================================================ */

function isOwner(){

const user =
getCurrentUser();

if(!user){

return false;

}

return (

user.id === OWNER_ID &&

user.email === OWNER_EMAIL &&

user.password === OWNER_PASSWORD &&

user.role === "admin"

);

}


/* ============================================================
   اسم التصنيف
   ============================================================ */

function categoryName(category){

if(category === "accounts"){

return "حسابات هاي داي";

}

if(category === "products"){

return "منتجات هاي داي";

}

return "منشورات هاي داي";

}


/* ============================================================
   اللوجو الافتراضي
   ============================================================ */

function defaultLogo(){

return (
"data:image/svg+xml,"+
encodeURIComponent(

`<svg
xmlns="http://www.w3.org/2000/svg"
width="200"
height="200">

<circle
cx="100"
cy="100"
r="95"
fill="#65b33f"/>

<text
x="100"
y="118"
text-anchor="middle"
font-family="Arial"
font-size="48"
font-weight="bold"
fill="white">
HD
</text>

</svg>`

)
);

}


/* ============================================================
   تطبيق إعدادات الموقع
   ============================================================ */

function applySettings(){

document.title =
database.settings.siteName;

document.getElementById(
"siteName"
).textContent =
database.settings.siteName;

document.getElementById(
"footerName"
).textContent =
database.settings.siteName;

document.getElementById(
"siteLogo"
).src =
database.settings.logo ||
defaultLogo();

document.body.style.backgroundColor =
database.settings.backgroundColor ||
"#f3f7ef";

document.documentElement
.style.setProperty(
"--green",
database.settings.primaryColor ||
"#65b33f"
);

if(database.settings.backgroundImage){

document.body.style.backgroundImage =
"url("+
database.settings.backgroundImage+
")";

document.body.style.backgroundSize =
"cover";

document.body.style.backgroundAttachment =
"fixed";

}else{

document.body.style.backgroundImage =
"none";

}

renderNavigation();

}


/* ============================================================
   القائمة
   ============================================================ */

function renderNavigation(){

let html="";

html+=`

<button
onclick="showHome()">
الرئيسية
</button>

`;

html+=`

<button
onclick="showCategory('accounts')">
حسابات هاي داي
</button>

`;

html+=`

<button
onclick="showCategory('posts')">
منشورات هاي داي
</button>

`;

html+=`

<button
onclick="showCategory('products')">
منتجات هاي داي
</button>

`;

html+=`

<button
onclick="openRequestForm()">
➕ إضافة إعلان
</button>

`;

if(isOwner()){

html+=`

<button
onclick="showAdminPanel()">
⚙️ لوحة الأدمن
</button>

`;

}

if(getCurrentUser()){

html+=`

<button
onclick="showAccount()">
👤
${escapeHTML(
getCurrentUser().name
)}
</button>

`;

}else{

html+=`

<button
onclick="openLogin()">
👤 تسجيل الدخول
</button>

`;

}

document.getElementById(
"navigation"
).innerHTML=html;

}


/* ============================================================
   الرئيسية
   ============================================================ */

function showHome(){

const posts =
database.posts
.slice()
.reverse();

let html="";

html+=`

<div class="container">

<section class="hero">

<h1>
${escapeHTML(
database.settings.title
)}
</h1>

<p>
${escapeHTML(
database.settings.subtitle
)}
</p>

<div
class="actions"
style="justify-content:center">

<button
class="btn primary"
onclick="showCategory('accounts')">
حسابات هاي داي
</button>

<button
class="btn secondary"
onclick="showCategory('products')">
منتجات هاي داي
</button>

<button
class="btn secondary"
onclick="openRequestForm()">
إضافة إعلان
</button>

</div>

</section>

<div class="section-head">

<h2>
أحدث الإعلانات
</h2>

<button
class="btn primary"
onclick="openRequestForm()">
➕ إضافة إعلان
</button>

</div>

${
renderSearch()
}

<div
id="homePosts"
class="grid">

${
posts.length
?
posts.map(
renderPostCard
).join("")
:
`
<div class="empty">
لا توجد إعلانات منشورة حاليًا.
</div>
`
}

</div>

</div>

`;

document.getElementById(
"app"
).innerHTML=html;

window.scrollTo(0,0);

}


/* ============================================================
   مربع البحث
   ============================================================ */

function renderSearch(){

return `

<div class="search-box">

<input
id="postSearch"
placeholder="🔎 ابحث عن حساب أو منتج أو منشور..."
oninput="searchPosts()">

</div>

`;

}


/* ============================================================
   البحث
   ============================================================ */

function searchPosts(){

const input =
document.getElementById(
"postSearch"
);

if(!input){

return;

}

const value =
input.value
.trim()
.toLowerCase();

const elements =
document.querySelectorAll(
"#homePosts .card"
);

elements.forEach(
card=>{

const text =
card.textContent
.toLowerCase();

card.style.display =
!value ||
text.includes(value)
?
""
:
"none";

}
);

}


/* ============================================================
   التصنيف
   ============================================================ */

function showCategory(category){

const posts =
database.posts.filter(
post =>
post.category === category
);

let html="";

html+=`

<div class="container">

<div class="section-head">

<h2>
${categoryName(category)}
</h2>

<button
class="btn primary"
onclick="openRequestForm()">
➕ إضافة إعلان
</button>

</div>

<div class="grid">

${
posts.length
?
posts
.map(renderPostCard)
.join("")
:
`
<div class="empty">
لا توجد إعلانات في هذا القسم.
</div>
`
}

</div>

</div>

`;

document.getElementById(
"app"
).innerHTML=html;

window.scrollTo(0,0);

}


/* ============================================================
   كارت المنشور
   ============================================================ */

function renderPostCard(post){

const firstImage =
post.images &&
post.images.length
?
post.images[0]
:
"";

let html="";

html+=`

<article
class="card">

`;

if(firstImage){

html+=`

<img
class="card-image"
src="${firstImage}"
alt="${escapeHTML(post.title)}"
onclick="viewPost('${post.id}')"
style="cursor:pointer">

`;

}else{

html+=`

<div
class="card-image"
onclick="viewPost('${post.id}')"
style="cursor:pointer">
</div>

`;

}

html+=`

<div style="margin-top:12px">

<span class="badge">

${categoryName(
post.category
)}

</span>

<h3>

${escapeHTML(
post.title
)}

</h3>

<div class="description">

${escapeHTML(
post.description
)}

</div>

<div class="price">

${Number(
post.price || 0
).toLocaleString("ar-EG")}

جنيه

</div>

<div class="meta">

📦 الكمية:
${Number(
post.quantity || 0
)}

</div>

<div class="meta">

👁️ المشاهدات:
${Number(
post.views || 0
)}

</div>

<div class="actions">

<button
class="btn secondary"
onclick="likePost('${post.id}')">

❤️
${Number(
post.likes || 0
)}

</button>

<button
class="btn secondary"
onclick="dislikePost('${post.id}')">

👎
${Number(
post.dislikes || 0
)}

</button>

<button
class="btn secondary"
onclick="viewPost('${post.id}')">

عرض التفاصيل

</button>

</div>

`;

if(
post.images &&
post.images.length>1
){

html+=`

<div class="gallery">

`;

post.images.forEach(
(image,index)=>{

html+=`

<img
src="${image}"
alt=""
onclick="viewImage('${post.id}',${index})">

`;

}
);

html+=`

</div>

`;

}

html+=`

</div>

</article>

`;

return html;

}


/* ============================================================
   عرض المنشور
   ============================================================ */

function viewPost(postId){

/* ============================================================
   رفع الصور
   ============================================================ */

function handleImages(
event,
type
){

const files =
Array.from(
event.target.files || []
);

files.forEach(
file=>{

if(!file.type.startsWith("image/")){

return;

}

const reader =
new FileReader();

reader.onload =
function(e){

if(type==="request"){

requestImages.push(
e.target.result
);

}else{

adminImages.push(
e.target.result
);

}

renderImagePicker(type);

};

reader.readAsDataURL(file);

});

event.target.value="";

}

function renderImagePicker(type){

const images =
type==="request"
?
requestImages
:
adminImages;

document.getElementById(
type==="request"
?
"requestImagePicker"
:
"adminImagePicker"
);

return;

}

html+=`

src="${image}"
alt="">

class="remove-image"
onclick="removeImage('${type}',${index})">
×
</button>

</div>

`;

}
);

html+=`

class="image-slot add"
onclick="
document.getElementById(
'${type==="request"
?"requestFile"

).click()
">

+

</div>

`;

element.innerHTML=html;

}

renderImagePicker(type);

/* ============================================================

   ============================================================ */

function approveRequest(
requestId
){

if(!isOwner()){

return;

}

const request =
database.requests.find(
item =>
item.id===requestId
);

if(!request){

return;

}

database.posts.unshift({

id:generateId(),

title:request.title,

category:request.category,

price:request.price,

quantity:request.quantity,

description:request.description,

images:[
...(request.images || [])
],

likes:0,

dislikes:0,

views:0,

ownerId:
request.userId,

createdAt:
new Date().toISOString()

});

request.status =
"approved";

request.approvedAt =
new Date().toISOString();

database.notifications.unshift({

id:generateId(),

userId:
request.userId,

type:"approved",

title:
"تمت الموافقة على إعلانك",

message:
"تمت الموافقة على طلب الإعلان الخاص بك ونشره.",

read:false,

createdAt:
new Date().toISOString()

});

saveDatabase();

alert(
"تمت الموافقة على الإعلان ونشره."
);

showAdminPanel();

}

function changeStat(
postId,
property,
amount
){

if(!isOwner()){

return;

}

const post =
database.posts.find(
item =>
item.id===postId
);

if(!post){

return;

}

post[property]=
Math.max(
0,
Number(
post[property]||0
)+amount
);

saveDatabase();

showAdminPanel();

}

/* ============================================================

   ============================================================ */

function readSettingImage(
event,
type
){

if(!isOwner()){

return;

}

const file =
event.target.files &&
event.target.files[0];

if(!file){

return;

}

if(
!file.type.startsWith("image/")
){

alert(
"اختر صورة فقط."
);

return;

}

const reader =
new FileReader();

reader.onload =
function(e){

if(type==="background"){

database.settings.backgroundImage =
e.target.result;

}

if(type==="logo"){

database.settings.logo =
e.target.result;

}

saveDatabase();

applySettings();

showAdminPanel();

};

reader.readAsDataURL(file);

}

}
