<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESULTAN HAY DAY STORE | متجر السلطان لمزارع هاي داي</title>
    <!-- مكتبة خطوط وأيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- خط عربي مميز Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gold: #d4af37;
            --light-gold: #f3e5ab;
            --dark-gold: #997a15;
            --bg-deep: #0b0b0b;
            --bg-card: #141414;
            --border-color: #332900;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #000000, #1a1500);
            border-bottom: 2px solid var(--primary-gold);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.15);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 900;
            color: var(--primary-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 2px 5px rgba(212, 175, 55, 0.3);
        }

        .logo i {
            font-size: 28px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
            align-items: center;
        }

        nav a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
            cursor: pointer;
            font-size: 15px;
        }

        nav a:hover, nav a.active {
            color: var(--primary-gold);
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
        }

        .cart-btn {
            background: linear-gradient(135deg, var(--primary-gold), var(--dark-gold));
            color: #000;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            border: none;
            transition: 0.3s;
            box-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
        }

        .cart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.5);
        }

        .hero {
            text-align: center;
            padding: 70px 20px;
            background: radial-gradient(circle at center, #261f00 0%, var(--bg-deep) 70%);
            border-bottom: 1px solid var(--border-color);
        }

        .hero h1 {
            font-size: 42px;
            color: var(--primary-gold);
            margin-bottom: 15px;
            font-weight: 900;
            text-shadow: 0 3px 10px rgba(0,0,0,0.8);
        }

        .hero p {
            color: var(--text-muted);
            font-size: 18px;
            max-width: 600px;
            margin: 0 auto;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 26px;
            color: var(--primary-gold);
            margin-bottom: 25px;
            border-right: 4px solid var(--primary-gold);
            padding-right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .product-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: 0.3s;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-gold);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.2);
        }

        .product-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #1f1f1f;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-gold);
            font-size: 45px;
            border-bottom: 1px solid var(--border-color);
        }

        .product-body {
            padding: 20px;
        }

        .product-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #fff;
        }

        .product-specs {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .product-specs li {
            list-style: none;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .product-specs li i {
            color: var(--primary-gold);
            font-size: 11px;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid rgba(212, 175, 55, 0.1);
        }

        .product-price {
            font-size: 20px;
            font-weight: 900;
            color: var(--primary-gold);
        }

        .buy-btn {
            background-color: transparent;
            border: 2px solid var(--primary-gold);
            color: var(--primary-gold);
            padding: 6px 15px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .buy-btn:hover {
            background-color: var(--primary-gold);
            color: #000;
        }

        /* نافذة السلة والطلب */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--bg-card);
            border: 2px solid var(--primary-gold);
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            padding: 30px;
            position: relative;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
        }

        .close-modal {
            position: absolute;
            top: 15px;
            left: 20px;
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
            transition: 0.3s;
        }

        .close-modal:hover {
            color: var(--primary-gold);
        }

        .modal-title {
            color: var(--primary-gold);
            font-size: 22px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 10px 15px;
            background: #0f0f0f;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-gold);
        }

        .submit-order-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-gold), var(--dark-gold));
            color: #000;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }

        .submit-order-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        footer {
            background: #000;
            border-top: 1px solid var(--border-color);
            text-align: center;
            padding: 30px;
            margin-top: 60px;
            color: var(--text-muted);
            font-size: 14px;
        }

        footer span {
            color: var(--primary-gold);
            font-weight: 700;
        }

        @media (max-width: 768px) {
            nav ul { display: none; }
            .hero h1 { font-size: 30px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-crown"></i>
            ESULTAN STORE
        </div>
        <nav>
            <ul>
                <li><a href="#" class="active">الرئيسية</a></li>
                <li><a href="#products">المزارع والحسابات</a></li>
                <li><a href="#support">الدعم الفني</a></li>
            </ul>
        </nav>
        <button class="cart-btn" onclick="openCartModal()">
            <i class="fa-solid fa-shopping-cart"></i> السلة (<span id="cart-count">0</span>)
        </button>
    </header>

    <div class="hero">
        <h1>متجر السلطان لمزارع هاي داي الفاخرة</h1>
        <p>احصل على أقوى المزارع والحسابات بمستويات عالية وموارد ضخمة مع ضمان وتسليم فوري وسريع.</p>
    </div>

    <div class="container" id="products">
        <div class="section-title">
            <span>الحسابات والمزارع المتاحة حالياً</span>
        </div>

        <div class="products-grid" id="products-list">
            <!-- المنتجات سيتم توليدها تلقائياً عبر سكربت الجافاسكريبت -->
        </div>
    </div>

    <!-- نافذة إتمام الطلب والسلة -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeCartModal()">&times;</span>
            <div class="modal-title">إتمام عملية الشراء</div>
            <div id="cart-items-summary" style="margin-bottom: 20px; color: var(--text-muted); font-size: 14px;"></div>
            
            <div class="form-group">
                <label>الاسم الكامل</label>
                <input type="text" id="custName" class="form-control" placeholder="أدخل اسمك الكريم">
            </div>
            <div class="form-group">
                <label>رقم الواتساب (للتواصل وإرسال الحساب)</label>
                <input type="text" id="custPhone" class="form-control" placeholder="مثال: 00966xxxxxxxx">
            </div>
            <button class="submit-order-btn" onclick="checkoutOrder()">تأكيد وإرسال الطلب عبر واتساب</button>
        </div>
    </div>

    <footer>
        جميع الحقوق محفوظة &copy; 2026 <span>ESULTAN HAY DAY STORE</span>
    </footer>

    <script>
        // قاعدة بيانات المنتجات (المزارع والحسابات)
        const products = [
            {
                id: 1,
                title: "مزرعة مستوى ملكي (مستوى 85)",
                specs: ["مستوى اللعبة: 85", "ملايين القطع الذهبية والمجوهرات", "مبان وأشجار مكتملة النطاق", "توصيل آمن بربط Supercell ID"],
                price: "45 دولار",
                icon: "fa-tractor"
            },
            {
                id: 2,
                title: "مزرعة المحترفين (مستوى 60)",
                specs: ["مستوى اللعبة: 60", "موارد وتخزين ضخم جداً", "جاهزة للمنافسة والإنتاج السريع", "ضمان كامل وتسليم فوري"],
                price: "30 دولار",
                icon: "fa-wheat-awn"
            },
            {
                id: 3,
                title: "مزرعة البداية القوية (مستوى 40)",
                specs: ["مستوى اللعبة: 40", "أراضي موسعة ومعدات جاهزة", "كمية ممتازة من الماس والذهب", "إشراف ودعم فني مخصص"],
                price: "18 دولار",
                icon: "fa-seedling"
            },
            {
                id: 4,
                title: "باكدج أدوات وتوسعة ضخم",
                specs: ["أدوات توسعة الحظيرة والصومعة (1000 قطعة)", "موارد نادرة متنوعة", "تسليم مباشر داخل اللعبة", "بدون حظر وبأمان تام"],
                price: "12 دولار",
                icon: "fa-boxes-packing"
            }
        ];

        let selectedProduct = null;

        function renderProducts() {
            const grid = document.getElementById('products-list');
            grid.innerHTML = products.map(p => `
                <div class="product-card">
                    <div class="product-img">
                        <i class="fa-solid ${p.icon}"></i>
                    </div>
                    <div class="product-body">
                        <div class="product-title">${p.title}</div>
                        <ul class="product-specs">
                            ${p.specs.map(spec => `<li><i class="fa-solid fa-check"></i> ${spec}</li>`).join('')}
                        </ul>
                        <div class="product-footer">
                            <span class="product-price">${p.price}</span>
                            <button class="buy-btn" onclick="selectProduct(${p.id})">اطلب الآن</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function selectProduct(id) {
            selectedProduct = products.find(p => p.id === id);
            document.getElementById('cart-count').innerText = "1";
            document.getElementById('cart-items-summary').innerHTML = `المنتج المختار: <b style="color:var(--primary-gold)">${selectedProduct.title}</b> بقيمة <b style="color:var(--primary-gold)">${selectedProduct.price}</b>`;
            document.getElementById('cartModal').style.display = 'flex';
        }

        function openCartModal() {
            if (!selectedProduct) {
                alert("يرجى اختيار مزرعة أو منتج أولاً من المتجر!");
                return;
            }
            document.getElementById('cartModal').style.display = 'flex';
        }

        function closeCartModal() {
            document.getElementById('cartModal').style.display = 'none';
        }

        function checkoutOrder() {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();

            if (!name || !phone) {
                alert("الرجاء إدخال الاسم ورقم الواتساب لإتمام الطلب.");
                return;
            }

            const message = `مرحباً متجر السلطان (ESULTAN STORE)، أرغب في شراء:\n\n*المنتج:* ${selectedProduct.title}\n*السعر:* ${selectedProduct.price}\n*اسم العميل:* ${name}\n*رقم التواصل:* ${phone}`;
            const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(message)}`;
            
            window.open(whatsappUrl, '_blank');
            closeCartModal();
        }

        // تشغيل عرض المنتجات عند التحميل
        window.onload = renderProducts;
    </script>
</body>
</html>
